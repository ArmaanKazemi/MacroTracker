<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fuel</title>
  <meta name="description" content="Personal nutrition tracker">
  <meta name="theme-color" content="#f4efe6">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fuel">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cinzel-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved theme before first paint (no flash).
    try { const t = localStorage.getItem('fuel-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Sections">
      <a href="#/today" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17.5a8 8 0 1 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 13.5l3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="13.5" r="1.4" fill="currentColor"/></svg>
        <span>Today</span>
      </a>
      <a href="#/nutrients" data-tab="nutrients">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M5.5 3.8h13M6 21h12M5 18.8h14"/><path d="M7.5 6.5v12M10.5 6.5v12M13.5 6.5v12M16.5 6.5v12"/></g></svg>
        <span>Nutrients</span>
      </a>
      <button class="tab-add" type="button" data-fab aria-label="Add food">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
      </button>
      <a href="#/foods" data-tab="foods">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20C9 15 13 10 20 4"/><path d="M9.5 15.5c-3-.6-5 .6-6 2.6 2.4.6 4.3 0 6-2.6zM12 12.5c0-3 1.8-5 4.3-5.6-.6 2.5-1.8 4.3-4.3 5.6zM15.5 9c-3-.6-4.8.5-5.4 2.5 2 .6 3.8 0 5.4-2.5z"/></g></svg>
        <span>Foods</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="2.1" class="knob" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12" r="2.1" class="knob" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2.1" class="knob" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
