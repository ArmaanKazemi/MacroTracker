name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        working-directory: tools
        run: npm install --no-audit --no-fund --omit=dev

      - name: Build CoFID food database from gov.uk
        working-directory: tools
        # If gov.uk is unreachable the site still deploys (with a committed
        # app/data/cofid.json if you have one, otherwise the starter set).
        run: node build-cofid.mjs --download || echo "::warning::CoFID download/convert failed - deploying without a fresh cofid.json"

      - name: Stamp service worker version so phones pick up the update
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'fuel-${GITHUB_SHA::8}'/" app/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
